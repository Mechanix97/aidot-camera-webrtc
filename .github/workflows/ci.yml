name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile
        run: python -m compileall -q main.py aidot tools

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Docker build
        run: docker build -t aidot-webrtc:ci .
