services:
  aidot-webrtc:
    build: .
    image: aidot-webrtc:latest
    container_name: aidot-webrtc
    # Run as lucas (uid 1000): recordings/snapshots stay owned by the host user.
    user: "1000:1000"
    # host networking: the local ICE candidates must be the real LAN ones,
    # otherwise the media falls back to TURN (or fails to connect).
    network_mode: host
    env_file:
      - .env
    volumes:
      # now.png for Home Assistant's local_file camera
      - /home/lucas/home-assistant/data:/data
      # rolling 10-min segments (RECORD_DIR=/rec), pruned after RETENTION_DAYS
      - /mnt/hdd/aidot:/rec
      # one consolidated mp4 per camera per day (DAILY_DIR=/daily)
      - /mnt/hdd/aidot-daily:/daily
    restart: unless-stopped

  # Live view: aidot-webrtc re-publishes each camera to RTSP (RTSP_BASE in
  # .env), mediamtx fans that out as HLS/WebRTC for browsers to watch.
  # host networking so aidot-webrtc can reach it at rtsp://127.0.0.1:8554
  # without a shared compose network (aidot-webrtc itself is host-networked).
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    network_mode: host
    restart: unless-stopped
